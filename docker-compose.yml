services:

  mysql:
    image: mysql:8.4
    container_name: sismo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: sismo_tech
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/sismo_tech.sql:/docker-entrypoint-initdb.d/01-sismo_tech.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sismo_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:1234@mysql:3306/sismo_tech
      CORS_ORIGINS: http://localhost:4173
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: sismo_frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  mysql_data: